# ---------------------------------------------------------------- parameters
unit.mib = "Mio"
group.general = "Général"
group.textures = "Textures"
group.budget = "Réduction ciblée"
param.min_physical.label = "Mémoire physique minimale"
param.min_physical.help = "Seuls les fichiers dont la mémoire physique déclarée dépasse cette valeur sont optimisés ; 16 Mio est le seuil d'avertissement de FiveM. 0 : tous les fichiers."
param.convert.label = "Convertir BC7 / DXT3 / non compressé"
param.convert.help = "Normal maps → DXT5 ; autres → DXT1, ou DXT5 si l'alpha est réellement utilisé. Les DXT1 / DXT5 gardent leur format."
param.force_pot.label = "Forcer les puissances de 2"
param.force_pot.help = "Arrondi vers le bas : 3000×3000 → 2048×2048, etc."
param.fix_mips.label = "Compléter les mipmaps"
param.fix_mips.help = "Chaîne complète jusqu'à 4 px, comme le jeu de base."
param.budget_enabled.label = "Réduire jusqu'au budget"
param.budget_enabled.help = "Si le fichier dépasse encore le budget après les corrections, les textures qui perdent le moins à être divisées par 2 le sont, une à la fois, jusqu'à passer sous le budget ou atteindre les limites ci-dessous."
param.budget.label = "Budget"
param.budget.help = "Mémoire physique visée par fichier. 16 Mio : plus d'avertissement FiveM."
param.max_steps.label = "Divisions max par texture"
param.max_steps.help = "1 division = largeur et hauteur ÷ 2 (mémoire ÷ 4)."
param.min_size.label = "Taille minimale"
param.min_size.help = "Une texture n'est jamais réduite sous cette taille (petit côté)."
param.max_loss.label = "Perte maximale"
param.max_loss.help = "Écart moyen toléré entre la texture réduite et l'originale, en % de la plage noir → blanc (0 % : identique). Repères : mur de plâtre ÷2 ≈ 0,9 %, parquet ÷2 ≈ 1,5 %, lames de bois ÷2 ≈ 3 %, texte imprimé ≈ 14 %. Une texture qui perdrait plus n'est pas réduite."
param.force.label = "Forcer sous le budget"
param.force.help = "Si les limites ci-dessus ne suffisent pas, la réduction continue au-delà (perte, divisions, taille minimale jusqu'à 64 px), toujours en commençant par les textures qui perdent le moins ; les textes / logos et les rôles inconnus passent en dernier. Les palettes, émissives et script_rt ne sont jamais réduites."

# ---------------------------------------------------------------- presets
preset.leger.label = "Léger"
preset.leger.description = "Textures : conversion, puissance de 2, mipmaps. Aucune réduction de taille."
preset.equilibre.label = "Équilibré"
preset.equilibre.description = "Comme Léger, puis réduction ciblée jusqu'à 16 Mio : 2 divisions max, jamais sous 512 px, perte faible."
preset.fort.label = "Fort"
preset.fort.description = "Réduction ciblée plus poussée (3 divisions max, 256 px, perte moyenne) ; si ça ne suffit pas, réduction forcée jusqu'à passer sous 16 Mio."

