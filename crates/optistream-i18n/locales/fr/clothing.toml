# clothing messages (fr). Keys are looked up as "clothing.<key>".

# ---------------------------------------------------------------- method
method.label = "Vêtements / EUP"
method.description = "Vêtements addon et packs EUP : textures (.ytd et embarquées) et polygones (.ydd)."

# ---------------------------------------------------------------- parameter groups and units
group.textures = "Textures"
group.general = "Général"
group.meshes = "Maillages"
group.virtual_memory = "Mémoire virtuelle"
unit.mib = "Mio"
unit.tris = "tris"

# ---------------------------------------------------------------- parameters
param.tex_convert.label = "Convertir BC7 / DXT3 / non compressé"
param.tex_convert.help = "Normal maps → DXT5 ; autres → DXT1, ou DXT5 si l'alpha est réellement utilisé. Les DXT1 / DXT5 gardent leur format."
param.tex_force_pot.label = "Forcer les puissances de 2"
param.tex_force_pot.help = "Arrondi vers le bas : 3000×3000 → 2048×2048, etc. (sauf diffuses de peau _r)."
param.tex_fix_mips.label = "Compléter les mipmaps"
param.tex_fix_mips.help = "Chaîne complète jusqu'à 4 px, comme le jeu de base."
param.tex_halve.label = "Diviser par 2"
param.tex_halve.help = "Toutes les textures des fichiers traités sont réduites de moitié (sauf diffuses de peau _r)."
param.tex_crop.label = "Recadrer sur la zone utilisée"
param.tex_crop.help = "Les textures sont coupées à la partie de la feuille que le vêtement utilise vraiment (sans perte), et ses UV réécrites. S'applique au .ydd, à son _1.ydd et à toutes ses variations ensemble ; jamais aux pièces _r, cloth ou à textures répétées."
param.only_3d.label = "Fichiers 3D uniquement (.ydd)"
param.only_3d.help = "Optimise seulement les .ydd ; les .ytd sont laissés tels quels."
param.min_physical.label = "Mémoire physique minimale"
param.min_physical.help = "Seuls les fichiers dont la mémoire physique déclarée dépasse cette valeur sont optimisés (ou la mémoire virtuelle, si « Réduire sous 16 Mio de mémoire virtuelle » est actif) ; 16 Mio est le seuil d'avertissement de FiveM. 0 : tous les fichiers."
param.mesh_enabled.label = "Réduire les polygones"
param.mesh_enabled.help = "Décimation du LOD High au-dessus du budget (jamais sur le cloth)."
param.mesh_reorder.label = "Optimiser l'ordre des triangles (sans perte)"
param.mesh_reorder.help = "Cache de sommets et overdraw, triangles dégénérés ou en double retirés. Sommets inchangés ; shaders à transparence exclus."
param.mesh_budget_large.label = "Budget grosses pièces"
param.mesh_budget_large.help = "Triangles max du LOD High : hauts, bas, vestes, accessoires, sacs, cheveux, chaussures, masques."
param.mesh_budget_small.label = "Budget petites pièces"
param.mesh_budget_small.help = "Triangles max du LOD High : chaînes, mains, decals, props (montres, chapeaux, lunettes…)."
param.mesh_max_error.label = "Tolérance de déformation"
param.mesh_max_error.help = "Écart de forme maximal, en % de la taille de la pièce. La réduction s'arrête avant, même si le budget n'est pas atteint."
param.mesh_lower_lods.label = "Plafonner les LOD inférieurs"
param.mesh_lower_lods.help = "Un LOD Med/Low plus lourd que le nouveau High est réduit à sa taille."
param.geo_enabled.label = "Réduire sous 16 Mio de mémoire virtuelle"
param.geo_enabled.help = "Si un .ydd dépasse encore 16 Mio de mémoire virtuelle (avertissement FiveM) après le budget de triangles, ses polygones sont réduits jusqu'à passer dessous : LODs lointains d'abord (VLow, Low, Med), le LOD High seulement si ça ne suffit pas. Bords, coutures et skinning préservés ; jamais sur le cloth. Le segment système est toujours recompacté (sans perte)."
param.geo_high_floor.label = "Plancher du LOD High"
param.geo_high_floor.help = "Part minimale des triangles que le LOD High garde pour passer sous 16 Mio (après le budget de triangles)."
param.geo_high_error.label = "Tolérance du LOD High"
param.geo_high_error.help = "Écart de forme maximal du LOD High pendant cette réduction, en % de la taille de la pièce (les LODs lointains sont plus permissifs)."

# ---------------------------------------------------------------- presets
preset.light.label = "Léger"
preset.light.description = "Textures : conversion, puissance de 2, mipmaps. ≤ 80k tris."
preset.balanced.label = "Équilibré"
preset.balanced.description = "Textures : conversion, puissance de 2, mipmaps, recadrage sur la zone utilisée. ≤ 40k tris, puis sous 16 Mio de mémoire virtuelle (High ≥ 80 %)."
preset.strong.label = "Fort"
preset.strong.description = "Textures : comme Équilibré, puis divisées par 2. ≤ 20k tris, puis sous 16 Mio de mémoire virtuelle (High ≥ 60 %)."

