# clothing messages (en). Keys are looked up as "clothing.<key>".

# ---------------------------------------------------------------- method
method.label = "Clothing / EUP"
method.description = "Addon clothing and EUP packs: textures (.ytd and embedded) and polygons (.ydd)."

# ---------------------------------------------------------------- parameter groups and units
group.textures = "Textures"
group.general = "General"
group.meshes = "Meshes"
group.virtual_memory = "Virtual memory"
unit.mib = "MiB"
unit.tris = "tris"

# ---------------------------------------------------------------- parameters
param.tex_convert.label = "Convert BC7 / DXT3 / uncompressed"
param.tex_convert.help = "Normal maps → DXT5; others → DXT1, or DXT5 if the alpha is actually used. DXT1 / DXT5 keep their format."
param.tex_force_pot.label = "Force powers of 2"
param.tex_force_pot.help = "Rounded down: 3000×3000 → 2048×2048, etc. (except _r skin diffuses)."
param.tex_fix_mips.label = "Complete the mipmaps"
param.tex_fix_mips.help = "Full chain down to 4 px, like the base game."
param.tex_halve.label = "Halve"
param.tex_halve.help = "Every texture of the processed files is halved (except _r skin diffuses)."
param.tex_crop.label = "Crop to the used area"
param.tex_crop.help = "Textures are cut to the part of the sheet the garment actually uses (lossless), and its UVs rewritten. Applies to the .ydd, its _1.ydd and all its variations together; never to _r, cloth or tiled-texture pieces."
param.only_3d.label = "3D files only (.ydd)"
param.only_3d.help = "Optimises only the .ydd; the .ytd are left as they are."
param.min_physical.label = "Minimum physical memory"
param.min_physical.help = "Only files whose declared physical memory exceeds this value are optimised (or the virtual memory, if “Reduce below 16 MiB of virtual memory” is on); 16 MiB is the FiveM warning threshold. 0: every file."
param.mesh_enabled.label = "Reduce polygons"
param.mesh_enabled.help = "Decimation of the High LOD above the budget (never on cloth)."
param.mesh_reorder.label = "Optimise triangle order (lossless)"
param.mesh_reorder.help = "Vertex cache and overdraw, degenerate or duplicate triangles removed. Vertices unchanged; transparency shaders excluded."
param.mesh_budget_large.label = "Large pieces budget"
param.mesh_budget_large.help = "Max triangles of the High LOD: tops, bottoms, jackets, accessories, bags, hair, shoes, masks."
param.mesh_budget_small.label = "Small pieces budget"
param.mesh_budget_small.help = "Max triangles of the High LOD: chains, hands, decals, props (watches, hats, glasses…)."
param.mesh_max_error.label = "Deformation tolerance"
param.mesh_max_error.help = "Maximum shape deviation, in % of the piece size. The reduction stops before, even if the budget is not reached."
param.mesh_lower_lods.label = "Cap the lower LODs"
param.mesh_lower_lods.help = "A Med/Low LOD heavier than the new High is reduced to its size."
param.geo_enabled.label = "Reduce below 16 MiB of virtual memory"
param.geo_enabled.help = "If a .ydd still exceeds 16 MiB of virtual memory (FiveM warning) after the triangle budget, its polygons are reduced until it gets below: distant LODs first (VLow, Low, Med), the High LOD only if that is not enough. Edges, seams and skinning preserved; never on cloth. The system segment is always repacked (lossless)."
param.geo_high_floor.label = "High LOD floor"
param.geo_high_floor.help = "Minimum share of its triangles the High LOD keeps to get below 16 MiB (after the triangle budget)."
param.geo_high_error.label = "High LOD tolerance"
param.geo_high_error.help = "Maximum shape deviation of the High LOD during this reduction, in % of the piece size (distant LODs are more permissive)."

# ---------------------------------------------------------------- presets
preset.light.label = "Light"
preset.light.description = "Textures: conversion, power of 2, mipmaps. ≤ 80k tris."
preset.balanced.label = "Balanced"
preset.balanced.description = "Textures: conversion, power of 2, mipmaps, crop to the used area. ≤ 40k tris, then below 16 MiB of virtual memory (High ≥ 80%)."
preset.strong.label = "Strong"
preset.strong.description = "Textures: like Balanced, then halved. ≤ 20k tris, then below 16 MiB of virtual memory (High ≥ 60%)."

