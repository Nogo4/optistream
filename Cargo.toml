[workspace]
resolver = "2"
members = [
    "crates/optistream-rage",
    "crates/optistream-texture",
    "crates/optistream-mesh",
    "crates/optistream-core",
    "crates/optistream-clothing",
    "crates/optistream-mapping",
    "crates/optistream-vehicle",
    "apps/optistream",
    "apps/optistream-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
optistream-rage = { path = "crates/optistream-rage" }
optistream-texture = { path = "crates/optistream-texture" }
optistream-mesh = { path = "crates/optistream-mesh" }
optistream-core = { path = "crates/optistream-core" }
optistream-clothing = { path = "crates/optistream-clothing" }
optistream-mapping = { path = "crates/optistream-mapping" }
optistream-vehicle = { path = "crates/optistream-vehicle" }

anyhow = "1"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
texpresso = "2"
texture2ddecoder = "0.1"
meshopt = "0.7"
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.17"
egui_material_icons = { version = "0.9", default-features = false, features = ["outline"] }

[profile.release]
opt-level = 3
lto = "thin"

# Texture encoding and decimation are far too slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3
